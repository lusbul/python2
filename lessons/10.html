(function () {
  const lesson = document.getElementById('lesson');
  const cardMarkup = '<section class="time-engineers-card" aria-labelledby="time-engineers-title">\n  <div class="time-engineers-icon" aria-hidden="true">⚙️ ⏳</div>\n  <div>\n    <span class="time-engineers-label">ІНТЕРАКТИВНИЙ КВЕСТ</span>\n    <h2 id="time-engineers-title">Інженери часу</h2>\n    <p>Чотири інженерні виклики: виправляйте Python-код, перевіряйте дати й запускайте власні рішення. Працює зі смартфона.</p>\n    <a class="time-engineers-button" href="../quests/inzhenery_chasu.html">Розпочати квест →</a>\n  </div>\n</section>\n';
  function placeQuest() {
    if (document.getElementById('time-engineers-title')) return true;
    const candidates = lesson.querySelectorAll('h1,h2,h3,h4,h5,h6,.title,.heading,strong,b');
    let heading = Array.from(candidates).find(el => el.textContent.trim().replace(/\s+/g,' ').replace(/[.:!?]+$/,'') === 'Ваш результат');
    if (!heading) {
      heading = Array.from(lesson.querySelectorAll('*')).find(el => el.children.length === 0 && el.textContent.trim() === 'Ваш результат');
    }
    if (!heading) return false;
    let block = heading.closest('section,article,.card,.panel,.result,.result-card');
    if (!block || block === lesson) {
      block = heading;
      while (block.parentElement && block.parentElement !== lesson && !/^(SECTION|ARTICLE)$/.test(block.tagName)) block = block.parentElement;
    }
    if (block && block !== lesson) {
      block.insertAdjacentHTML('afterend', cardMarkup);
      return true;
    }
    return false;
  }
  if (!placeQuest()) {
    const observer = new MutationObserver(() => { if (placeQuest()) observer.disconnect(); });
    observer.observe(lesson, {childList:true,subtree:true,characterData:true});
  }
})();
</script><footer>Проєктний Python · Тема 10 / 32</footer><div id="live" role="status" aria-live="polite"></div></body></html>
